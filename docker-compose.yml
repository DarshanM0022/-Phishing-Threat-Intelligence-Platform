version: '3.8'

services:
  phishguard-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: phishguard-platform
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://phishguard_user:phishguard_secure_pass@db:5432/phishguard_db
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: phishguard-postgres
    environment:
      - POSTGRES_USER=phishguard_user
      - POSTGRES_PASSWORD=phishguard_secure_pass
      - POSTGRES_DB=phishguard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard_user -d phishguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
